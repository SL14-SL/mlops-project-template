version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      gcs-filesystem-stack:
        patterns:
          - fsspec
          - gcsfs
        update-types:
          - minor
          - patch

      template-python:
        patterns:
          - "*"
        exclude-patterns:
          - fsspec
          - gcsfs
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: pandas
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      template-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /template
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5

  - package-ecosystem: terraform
    directory: /template/infrastructure/terraform
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5

  - package-ecosystem: terraform
    directory: /template/infrastructure/terraform-bootstrap
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
