name: Terraform

on:
  pull_request:
    paths:
      - "infrastructure/terraform/**"
      - "infrastructure/terraform-bootstrap/**"
      - ".github/workflows/terraform.yml"
      - "infrastructure/terraform-aws/**"
  push:
    branches:
      - main
    paths:
      - "infrastructure/terraform/**"
      - "infrastructure/terraform-bootstrap/**"
      - ".github/workflows/terraform.yml"
      - "infrastructure/terraform-aws/**"

permissions:
  contents: read

jobs:
  validate:
    name: Validate Terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Validate selected cloud modules
        shell: bash
        run: |
          set -euo pipefail
          for module in infrastructure/terraform-bootstrap infrastructure/terraform infrastructure/terraform-aws; do
            if [ -d "$module" ]; then
              terraform -chdir="$module" fmt -check -recursive
              terraform -chdir="$module" init -backend=false -input=false
              terraform -chdir="$module" validate
            fi
          done
