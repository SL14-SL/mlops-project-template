name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint and test (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            uv_args: ""
          - name: aws
            uv_args: "--extra aws"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Create test environment
        run: cp .env.example .env

      - name: Synchronize dependencies
        run: uv sync --locked ${{ matrix.uv_args }}

      - name: Run Ruff
        run: uv run --locked ${{ matrix.uv_args }} ruff check .

      - name: Run tests
        run: uv run --locked ${{ matrix.uv_args }} pytest