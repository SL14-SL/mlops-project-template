version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      gcs-filesystem-stack:
        patterns:
          - fsspec
          - gcsfs
        update-types:
          - minor
          - patch

      python-minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - fsspec
          - gcsfs
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: pandas
        update-types:
          - version-update:semver-major


      # Upgrade FastAPI and Prefect together after verifying server compatibility.
      - dependency-name: fastapi
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch

      - dependency-name: prefect
        versions:
          - "3.9.0"

      # MLflow 3.17.2 requires PyArrow <26.
      - dependency-name: pyarrow
        versions:
          - ">=26,<27"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5

  - package-ecosystem: terraform
    directory: /infrastructure/terraform
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5

  - package-ecosystem: terraform
    directory: /infrastructure/terraform-bootstrap
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5