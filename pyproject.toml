[project]
name = "mlops-project-template"
version = "0.3.1"
description = "Reusable project template for production-oriented classification and forecasting systems"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "copier>=9,<10",
    "fastapi==0.161.1",
    "fsspec==2026.9.0",
    "gcsfs==2026.10.1",
    "httpx2>=2.12.0",
    "mlflow==3.17.2",
    "pandas==2.3.3",
    "pip-audit==2.10.1",
    "prefect>=3,<4",
    "prometheus-client==0.26.0",
    "pydantic>=2.12,<3",
    "pytest>=9.0.3,<10",
    "python-dotenv>=1.2,<2",
    "pyyaml>=6,<7",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]
